# 複製為根目錄 values.yaml 後填寫；字串與 secret 請保留引號。
llm:
  provider: "" # LangChain model_provider；需先以 uv add 安裝對應整合套件
  model: ""
  api_key: ""
  options: {} # 傳給所選 provider 的其他參數，例如 base_url

code_host:
  provider: "gitlab" # gitlab 或 github
  repository: "" # GitLab: group/project 或 project ID；GitHub: owner/repo
  api_url: null # null 使用官方 API；自架 GitLab 請填 https://host/api/v4
  token: ""

jenkins:
  base_url: null # 自動分析使用的 Jenkins 根網址，必須能從 Agent 容器連線
  job_name: "pdd/test-all-server" # controller 只接受這個 Job
  artifact_url: null # 指定 build 的 JaCoCo / Cobertura XML artifact URL
  metadata_url: null # 同 build 的 coverage-metadata.json；沒有 trace 時必填
  trace_url: null # 同 build 的 Java per-test trace JSON；尚未配置時只有 LLM 推薦
  username: ""
  api_token: "" # 與 username 一起填寫，公開 artifact 可兩者留空

analysis:
  max_test_files: 20

service:
  api_token: "" # 32+ 字元的隨機 token；Jenkins 使用相同 Bearer token
  root_path: "/test-agent"
  data_directory: "/data" # 容器的持久 volume；本機 serve 可改為 .state
  max_pending: 100

deployment:
  docker_context: "default" # 明確選擇引擎，不切換使用者的目前 context
  traefik_container: "pdd-traefik"
  traefik_network: "pdd-network" # 共用代理與 Agent 同引擎時加入
  jenkins_network: null # Jenkins 同引擎時可填 pdd-jenkins_default
  published_port: null # 跨引擎代理才需要公開 Agent port
